<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TinkerPCB</title>
<link rel="icon" href="data:,">
<!--
  Design Read: Operate tool for secondary STEM students, workshop bench,
  Cloof ink on paper with one amber accent. Dials 4 / 3 / 6.
  Locked light theme: classroom overhead light, paper worksheet around a green board.
-->
<style>
  :root {
    --ink: #1c1b19;
    --paper: #f3f1ec;
    --paper-2: #e6e1d6;
    --muted: #5c574e;
    --line: #d5cfc4;
    --accent: #8a5a0c;
    --amber: #c4841d;
    --danger: #8d2f24;
    --ok: #1e6a42;
    --ease: cubic-bezier(0.23, 1, 0.32, 1);
    --r: 8px;
    --z-toast: 40;
    --font: "PingFang HK", "Noto Sans HK", "Heiti TC", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.45;
  }
  button, input, select { font: inherit; color: inherit; }
  button {
    min-height: 44px;
    border: 1px solid var(--line);
    background: transparent;
    border-radius: var(--r);
    padding: 0 12px;
    cursor: pointer;
    transition: transform 160ms var(--ease), background-color 160ms var(--ease), border-color 160ms var(--ease);
  }
  button:active { transform: scale(0.97); }
  button:focus { outline: none; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  button.quiet { border-color: transparent; }
  @media (hover: hover) and (pointer: fine) {
    button:hover:not(:disabled) { border-color: var(--ink); }
    button.primary:hover:not(:disabled) { background: #2c2a26; }
    .lib-item:hover { background: #efeae1; }
  }
  input, select {
    min-height: 36px;
    border: 1px solid var(--line);
    background: #faf8f4;
    border-radius: var(--r);
    padding: 0 8px;
  }
  input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .app {
    height: 100vh;
    height: 100dvh;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; flex-direction: column; gap: 1px; min-width: 140px; }
  .brand strong { font-size: 20px; font-weight: 650; letter-spacing: -0.03em; line-height: 1.1; }
  .brand span { color: var(--muted); font-size: 12px; }
  .field { display: flex; flex-direction: column; gap: 2px; }
  .field span { font-size: 11px; color: var(--muted); }
  .field input[type="number"] { width: 72px; font-family: var(--mono); font-size: 13px; }
  #name { width: 160px; }
  .grow { flex: 1; }
  .work {
    display: grid;
    grid-template-columns: 248px minmax(0, 1fr) 300px;
    min-height: 0;
    overflow: hidden;
  }
  aside, main { min-height: 0; }
  .lib, .spec {
    overflow: auto;
    padding: 14px 14px 20px;
  }
  .lib { border-right: 1px solid var(--line); }
  .spec { border-left: 1px solid var(--line); }
  h2 {
    margin: 0 0 8px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .note { margin: 0 0 12px; color: var(--muted); font-size: 12px; line-height: 1.5; }
  .lib-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .lib-item {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    text-align: center;
    margin: 0;
    padding: 8px 6px 10px;
    background: #fffdf8;
  }
  .lib-item b { font-weight: 650; font-size: 14px; }
  .lib-item small { color: var(--muted); font-size: 11px; line-height: 1.3; }
  .lib-item canvas { width: 76px; height: 52px; display: block; }
  .coach {
    position: absolute;
    top: 12px;
    left: 12px;
    right: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    z-index: 2;
    pointer-events: none;
  }
  .coach span {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    border-radius: 999px;
    padding: 5px 10px;
  }
  .coach span:nth-child(1) { background: #ffe3b8; }
  .coach span:nth-child(2) { background: #d7f3df; }
  .coach span:nth-child(3) { background: #d7e6ff; }
  .coach span:nth-child(4) { background: #f6d7ea; }
  .templates { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
  main { position: relative; background: #d4cfc6; overflow: hidden; }
  main.is-3d .legend,
  main.is-3d [data-layer],
  main.is-3d .hint { display: none; }
  .mark {
    position: absolute;
    top: 18px;
    right: 18px;
    height: 22px;
    width: auto;
    z-index: 3;
    pointer-events: none;
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #board3d {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: none;
    touch-action: none;
  }
  main.is-3d:not(.nogl) #board3d { display: block; }
  main.is-3d:not(.nogl) #board { display: none; }
  main.nogl.is-3d #board { display: block; }
  .canvas-tools {
    position: absolute;
    left: 12px;
    bottom: 12px;
    display: flex;
    gap: 6px;
    z-index: 2;
  }
  .canvas-tools button[aria-pressed="true"] {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }
  .legend {
    position: absolute;
    right: 12px;
    bottom: 12px;
    font-size: 12px;
    color: var(--ink);
    background: color-mix(in srgb, var(--paper) 92%, transparent);
    border: 1px solid var(--line);
    border-radius: var(--r);
    padding: 6px 8px;
    display: flex;
    gap: 10px;
  }
  .swatch { display: inline-block; width: 18px; height: 4px; margin-right: 4px; vertical-align: middle; border-radius: 1px; }
  .hint {
    position: absolute;
    top: 12px;
    left: 12px;
    right: 12px;
    pointer-events: none;
    color: var(--muted);
    font-size: 13px;
  }
  .tabs { display: flex; gap: 4px; margin-bottom: 12px; }
  .tabs button { flex: 1; padding: 0 6px; }
  .tabs button[aria-selected="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .row {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
  }
  .row strong { font-weight: 600; }
  .pins { color: var(--muted); font-family: var(--mono); font-size: 12px; }
  .err { color: var(--danger); }
  .ok { color: var(--ok); }
  .steps { margin: 0; padding-left: 18px; }
  .steps li { margin: 0 0 8px; }
  .spec input[type="text"] { width: 100%; margin-top: 4px; }
  footer {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 16px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 12px;
    font-family: var(--mono);
  }
  #toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%) translateY(8px);
    background: var(--ink);
    color: var(--paper);
    border-radius: var(--r);
    padding: 10px 14px;
    z-index: var(--z-toast);
    opacity: 0;
    pointer-events: none;
    transition: opacity 180ms var(--ease), transform 180ms var(--ease);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (prefers-reduced-motion: reduce) {
    button, #toast { transition: none; }
  }
  @media (max-width: 1199px) {
    .legend { display: none; }
  }
  @media (max-width: 800px) {
    body, .app { height: auto; min-height: 100dvh; overflow: auto; }
    .work { grid-template-columns: 1fr; grid-template-rows: auto minmax(420px, 56dvh) auto; overflow: visible; }
    .lib, .spec { border: 0; border-bottom: 1px solid var(--line); }
    .lib-list { display: flex; gap: 8px; overflow-x: auto; }
    .lib-item { width: auto; min-width: 160px; }
    header { flex-wrap: wrap; }
    .grow { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <strong>TinkerPCB</strong>
      <span data-i18n="tagline">拖一拖，點一點</span>
    </div>
    <label class="field"><span data-i18n="project">專案</span><input id="name" type="text" maxlength="24" autocomplete="off"></label>
    <label class="field"><span data-i18n="width">寬 mm</span><input id="bw" type="number" min="20" max="100" step="1"></label>
    <label class="field"><span data-i18n="height">高 mm</span><input id="bh" type="number" min="20" max="100" step="1"></label>
    <div class="grow"></div>
    <button type="button" id="lang" aria-pressed="false">English</button>
    <button type="button" id="undo" disabled data-i18n="undo">還原</button>
    <button type="button" class="primary" id="download" data-i18n="download">下載製板檔</button>
  </header>
  <div class="work">
    <aside class="lib">
      <h2 data-i18n="examples">例子</h2>
      <div class="templates">
        <button type="button" id="tpl-led" data-i18n="tplLed">LED 小燈</button>
        <button type="button" id="tpl-header" data-i18n="tplHeader">排針小燈</button>
        <button type="button" id="tpl-ubit" data-i18n="tplUbit">micro:bit 小燈</button>
        <button type="button" id="tpl-uno" data-i18n="tplUno">UNO 小燈</button>
        <button type="button" id="tpl-blank" data-i18n="tplBlank">空白板</button>
      </div>
      <h2 data-i18n="parts">零件</h2>
      <p class="note" data-i18n="partsNote">點圖，或者拖上綠色的板。金色圓點就是可以接線的腳。</p>
      <div class="lib-list" id="lib"></div>
      <button type="button" id="holes" style="width:100%;margin-top:8px" data-i18n="holes">加四角鎖孔</button>
    </aside>
    <main>
      <canvas id="board" tabindex="0" aria-label="電路板"></canvas>
      <canvas id="board3d" aria-label="電路板立體圖"></canvas>
      <div class="coach" aria-hidden="true">
        <span data-i18n="step1">1 拖圖上板</span>
        <span data-i18n="step2">2 點兩個腳</span>
        <span data-i18n="step3">3 睇立體</span>
        <span data-i18n="step4">4 下載</span>
      </div>
      <p class="hint" id="hint"></p>
      <div class="canvas-tools">
        <button type="button" id="view-flat" aria-pressed="false" data-i18n="flat">平面</button>
        <button type="button" id="view-3d" aria-pressed="true" data-i18n="solid">立體</button>
        <button type="button" id="view-front" data-i18n="front">正面</button>
        <button type="button" id="zoom-out" aria-label="縮小">−</button>
        <button type="button" id="zoom-in" aria-label="放大">+</button>
        <button type="button" id="zoom-fit" data-i18n="fit">合板</button>
        <button type="button" data-layer="all" aria-pressed="true" data-i18n="all">全部</button>
        <button type="button" data-layer="0" data-i18n="top">頂層</button>
        <button type="button" data-layer="1" data-i18n="bottom">底層</button>
      </div>
      <div class="legend">
        <span><i class="swatch" style="background:#e6c98a"></i><span data-i18n="top">頂層</span></span>
        <span><i class="swatch" style="background:#8a6230"></i><span data-i18n="bottom">底層</span></span>
      </div>
    </main>
    <aside class="spec">
      <div class="tabs" role="tablist">
        <button type="button" id="tab-net" role="tab" aria-selected="true" data-i18n="tabNet">接線</button>
        <button type="button" id="tab-drc" role="tab" aria-selected="false" data-i18n="tabCheck">檢查</button>
        <button type="button" id="tab-fab" role="tab" aria-selected="false" data-i18n="tabOrder">落單</button>
      </div>
      <div id="panel-net"></div>
      <div id="panel-drc" hidden></div>
      <div id="panel-fab" hidden></div>
    </aside>
  </div>
  <footer>
    <span id="status" data-i18n="statusStart">先拖一個圖上板</span>
    <span id="coord"></span>
  </footer>
</div>
<div id="toast" role="status"></div>
<script src="pcb-engine.js"></script>
<script src="pcb-view3d.js"></script>
<script type="importmap">

</script>

      sun.shadow.mapSize.set(1024, 1024);
      sun.shadow.camera.left = -140;
      sun.shadow.camera.right = 140;
      sun.shadow.camera.top = 140;
      sun.shadow.camera.bottom = -140;
      sun.shadow.camera.near = 20;
      sun.shadow.camera.far = 420;

  var MATS = null;

    MATS = {
      maskGreen: std(0x2eb068, 0.6),

      maskWhite: std(0xece8dc, 0.6),
      maskGreenB: dark(0x2eb068),
      maskBlackB: dark(0x242830),
      maskWhiteB: dark(0xece8dc),
      fr4: std(0xd6a86c, 0.8),
      copperT: std(0xe8b84c, 0.32, 0.7),
      copperB: std(0x9a7430, 0.4, 0.65),
      gold: std(0xf0c14a, 0.35, 0.7),
      dark: std(0x1c2420, 0.6),
      navy: std(0x24487a, 0.6),
      teal: std(0x00768a, 0.55),
      silver: std(0xc4c8ce, 0.35, 0.8),

  function mesh(geo, mat, x, y, z, shadow) {

  function shapeFromLoop(loop) {
    var sh = new T3.Shape();
    loop.forEach(function (pt, i) {
      if (i === 0) sh.moveTo(pt[0], pt[1]);
      else sh.lineTo(pt[0], pt[1]);
    });
    sh.closePath();
    return sh;
  }
  function roundedShape(w, h, r) {
    var s = new T3.Shape();
    s.moveTo(-w / 2, 0);
    s.lineTo(w / 2 - r, 0);
    s.quadraticCurveTo(w / 2, 0, w / 2, r);
    s.lineTo(w / 2, h - r);
    s.quadraticCurveTo(w / 2, h, w / 2 - r, h);
    s.lineTo(-w / 2 + r, h);
    s.quadraticCurveTo(-w / 2, h, -w / 2, h - r);
    s.lineTo(-w / 2, r);
    s.quadraticCurveTo(-w / 2, 0, -w / 2 + r, 0);
    s.closePath();
    return s;
  }

    (doc.routes || []).forEach(function (r) {

        var mat = seg.layer === 0 ? M.copperT : M.copperB;
        for (var i = 1; i < seg.pts.length; i++) {
          var a = seg.pts[i - 1], b = seg.pts[i];
          var ax = a[0], az = h - a[1], bx = b[0], bz = h - b[1];

        g.add(cyl(p.dia / 2, 0.12, M.copperB, x, -1.66, z));

      } else if (part.type === "res") {

        G.add(box(1.1, 2.5, 2.6, M.bandRed, -0.9, 4.0, 0));
        G.add(box(0.7, 2.5, 2.6, M.bandBlue, 1.2, 4.0, 0));
        [-5.08, 5.08].forEach(function (lx) {

          G.add(cyl(0.28, 1.93, M.gold, lx < 0 ? -4.115 : 4.115, 3.95, 0));

      } else if (part.type === "sw") {
        G.add(box(6.4, 3.1, 6.4, M.blackP, 0, 1.6, 0));

      } else if (part.type === "buzz") {

      } else if (part.type === "bat") {

        G.add(box(19.78, 8.5, 2.4, M.blackP, 36.83, -5.85, -2.54));
        G.add(box(14.7, 8.5, 2.4, M.blackP, 57.15, -5.85, -2.54));
        G.add(box(24.86, 8.5, 2.4, M.blackP, 30.226, -5.85, -50.8));
        G.add(box(19.78, 8.5, 2.4, M.blackP, 54.61, -5.85, -50.8));
        G.add(box(4.7, 8.5, 7.2, M.blackP, 64.9, -5.85, -27.94));

  function fitCam3D() {
    var d = Math.hypot(doc.w, doc.h) * 1.5 + 45;
    var th = 0.55, ph = 1.0;
    for (var i = 0; i < doc.parts.length; i++) {
      if (doc.parts[i].type === "uno") { ph = 0.78; d += 15; break; }
    }
    var c = new T3.Vector3(doc.w / 2, 0, doc.h / 2);
    three3d.camera.position.set(
      c.x + Math.sin(th) * d * Math.cos(ph),
      Math.sin(ph) * d,
      c.z + Math.cos(th) * d * Math.cos(ph)
    );
    three3d.controls.target.copy(c);
    three3d.controls.update();
  }

  function fits(type, x, y, ignore, rot) {
    var ghost = { type: type, x: x, y: y, rot: rot || 0 };
    var box = PCB.bodyBox(ghost);
    if (box.x < -0.02 || box.y < -0.02 || box.x + box.w > doc.w + 0.02 || box.y + box.h > doc.h + 0.02) return false;
    var ghostRects = PCB.partRects(ghost);
    for (var i = 0; i < doc.parts.length; i++) {
      if (doc.parts[i].uid === ignore) continue;
      var rects = PCB.partRects(doc.parts[i]);
      for (var a = 0; a < ghostRects.length; a++) {
        for (var j = 0; j < rects.length; j++) {
          var b = rects[j];
          if (ghostRects[a].x < b.x + b.w && ghostRects[a].x + ghostRects[a].w > b.x && ghostRects[a].y < b.y + b.h && ghostRects[a].y + ghostRects[a].h > b.y) return false;
        }

    return true;
  }
  function dockUbit(x, y) {
    var m = 28;
    var edges = [
      { d: y, rot: 0, x: Math.max(m, Math.min(doc.w - m, PCB.snap(x))), y: 0 },
      { d: doc.h - y, rot: 180, x: Math.max(m, Math.min(doc.w - m, PCB.snap(x))), y: doc.h },
      { d: x, rot: 270, x: 0, y: Math.max(m, Math.min(doc.h - m, PCB.snap(y))) },
      { d: doc.w - x, rot: 90, x: doc.w, y: Math.max(m, Math.min(doc.h - m, PCB.snap(y))) }
    ];
    edges.sort(function (a, b) { return a.d - b.d; });
    return edges[0];
  }

      else if (next === 90) { part.rot = 90; part.x = doc.w; part.y = Math.max(28, Math.min(doc.h - 28, part.y)); }
      else if (next === 180) { part.rot = 180; part.y = doc.h; part.x = Math.max(28, Math.min(doc.w - 28, part.x)); }
      else { part.rot = 270; part.x = 0; part.y = Math.max(28, Math.min(doc.h - 28, part.y)); }
      doc.routes = [];

      ctx.strokeStyle = "rgba(16, 28, 22, 0.85)";
      ctx.lineWidth = 3;
      ctx.strokeText(part.ref, tp[0], tp[1] - 4);
      ctx.fillText(part.ref, tp[0], tp[1] - 4);
    });
    ctx.fillStyle = "#f4f1ea";
    ctx.font = "600 12px " + getComputedStyle(document.body).fontFamily;
    var sigBase = doc.sigTop ? doc.h - 2.2 : (doc.sigY != null ? doc.sigY + 1.2 : 1.0);
    var tPos = b2c(1.2, sigBase);
    ctx.textAlign = "start";
    ctx.fillText(doc.name || "", tPos[0], tPos[1]);
    if (doc.sig) {
      ctx.textAlign = "right";
      var edgeR = doc.outline === "uno" ? 66.04 : doc.w;
      var sPos = b2c(edgeR - 1.4, sigBase);
      ctx.fillText("CLOOF SIU", sPos[0], sPos[1]);
      ctx.textAlign = "start";
    }
    (doc.unrouted || []).forEach(function (u) {
      ctx.setLineDash([4, 4]);
      ctx.strokeStyle = "#c4841d";
      ctx.lineWidth = 1.25;
      ctx.setLineDash([]);
    });
    ctx.restore();
    if (drag && drag.kind === "lib" && drag.moved && drag.cx) {
      var pt = clientToBoard(drag.cx, drag.cy);
      if (pt) drawPart({ type: drag.type, x: PCB.snap(pt.x), y: PCB.snap(pt.y), rot: 0, value: "" }, true);
    }
    var empty = !doc.parts.length;
    document.getElementById("hint").textContent = empty ? t("emptyHint") : (wire ? t("pick2") : "");
  }

  function netLabel(net) {
    var groups = PCB.groupsInNet(doc, net);
    return groups.map(function (g) { return g.ref + "·" + g.label; }).join("  ");
  }

  function renderSide() {
    var check = PCB.check(doc);
    var netHost = document.getElementById("panel-net");
    var drcHost = document.getElementById("panel-drc");
    var fabHost = document.getElementById("panel-fab");
    netHost.textContent = "";
    var lead = document.createElement("p");
    lead.className = "note";
    lead.textContent = doc.nets.length
      ? t("wiresNote")
      : t("noWires");
    netHost.appendChild(lead);
    doc.nets.forEach(function (n) {
      var row = document.createElement("div");
      row.className = "row";
      var left = document.createElement("div");
      var name = document.createElement("input");
      name.type = "text";
      name.value = showNet(n.name);
      name.setAttribute("aria-label", t("netName"));
      name.addEventListener("change", function () {
        snapshot();
        PCB.renameNet(doc, n.id, name.value.trim() || n.name);
        save();
        renderSide();
      });
      var pins = document.createElement("div");
      pins.className = "pins";
      pins.textContent = netLabel(n);
      left.appendChild(name);
      left.appendChild(pins);
      var cut = document.createElement("button");
      cut.type = "button";
      cut.className = "quiet";
      cut.textContent = t("split");
      cut.addEventListener("click", function () {
        mutate(function () {
          var pin = n.pins[0];
          PCB.disconnectPin(doc, pin.uid, pin.pad);
          doc.nets = doc.nets.filter(function (x) { return x.id !== n.id; });
        });
      });
      row.appendChild(left);
      row.appendChild(cut);
      netHost.appendChild(row);
    });
    if (selected) {
      var part = PCB.findPart(doc, selected);
      if (part) {
        var spec = PCB.partById(part.type);
        var box = document.createElement("div");
        box.style.marginTop = "14px";
        var h = document.createElement("h2");
        h.textContent = part.ref + "  " + spec.name;
        box.appendChild(h);
        if (spec.values) {
          spec.values.forEach(function (v) {
            var b = document.createElement("button");
            b.type = "button";
            b.textContent = t("val_" + v) === ("val_" + v) ? v : t("val_" + v);
            b.style.margin = "0 6px 6px 0";
            if (part.value === v) b.className = "primary";
            b.addEventListener("click", function () {
              snapshot();
              PCB.setValue(doc, part.uid, v);
              PCB.route(doc);
              save();
              renderSide();
              draw();
            });
            box.appendChild(b);
          });
        }
        var rot = document.createElement("button");
        rot.type = "button";
        rot.textContent = t("rotate");
        rot.addEventListener("click", function () { mutate(function () { rotateSel(part.uid); }); });
        var del = document.createElement("button");
        del.type = "button";
        del.textContent = t("del");
        del.style.marginLeft = "6px";
        del.addEventListener("click", function () {
          mutate(function () { PCB.removePart(doc, part.uid); });
          selected = null;
        });
        box.appendChild(rot);
        box.appendChild(del);
        netHost.appendChild(box);
      }
    }
    drcHost.textContent = "";
    var head = document.createElement("p");
    head.className = check.ok ? "ok" : "err";
    head.textContent = check.ok ? t("checkOk") : t("checkBad");
    drcHost.appendChild(head);
    check.errors.forEach(function (e) {
      var row = document.createElement("div");
      row.className = "row err";
      row.textContent = issueText(e);
      drcHost.appendChild(row);
    });
    check.warnings.forEach(function (e) {
      var row = document.createElement("div");
      row.className = "row";
      row.textContent = issueText(e);
      drcHost.appendChild(row);
    });
    if (!check.errors.length && !check.warnings.length && doc.parts.length) {
      var ok = document.createElement("p");
      ok.className = "note";
      ok.textContent = t("rules");
      drcHost.appendChild(ok);
    }
    fabHost.textContent = "";
    var ol = document.createElement("ol");
    ol.className = "steps";
    [1, 2, 3, 4, 5].forEach(function (n) {
      var li = document.createElement("li");
      li.textContent = t("order" + n);
      ol.appendChild(li);
    });
    fabHost.appendChild(ol);
    var limits = document.createElement("p");
    limits.className = "note";
    limits.textContent = t("limits");
    fabHost.appendChild(limits);
    var mask = document.createElement("label");
    mask.className = "field";
    mask.appendChild(document.createElement("span")).textContent = t("mask");
    var sel = document.createElement("select");
    [["green", "green"], ["black", "black"], ["white", "white"]].forEach(function (opt) {
      var o = document.createElement("option");
      o.value = opt[0];
      o.textContent = t(opt[1]);
      if (doc.mask === opt[0]) o.selected = true;
      sel.appendChild(o);
    });
    sel.addEventListener("change", function () {
      doc.mask = sel.value;
      save();
      draw();
    });
    mask.appendChild(sel);
    fabHost.appendChild(mask);
  }

  function showTab(id) {
    ["net", "drc", "fab"].forEach(function (k) {
      document.getElementById("tab-" + k).setAttribute("aria-selected", k === id ? "true" : "false");
      document.getElementById("panel-" + k).hidden = k !== id;
    });
  }

  canvas.addEventListener("pointerdown", function (e) {
    canvas.focus();
    if (mode === "3d") {
      if (three3d) return; /* OrbitControls owns rotation */
      drag = { kind: "orbit", pid: e.pointerId, cx: e.clientX, cy: e.clientY, yaw: cam ? cam.yaw : 0.36, pitch: cam ? cam.pitch : 0.78 };
      canvas.setPointerCapture(e.pointerId);
      return;
    }
    var r = canvas.getBoundingClientRect();
    var x = e.clientX - r.left, y = e.clientY - r.top;
    var pad = hitPad(x, y);
    var part = hitPart(x, y);
    if (pad) {
      selected = pad.uid;
      if (wire && !(wire.uid === pad.uid && wire.pad === pad.pad)) {
        var from = wire;
        wire = null;
        mutate(function () { PCB.connect(doc, from.uid, from.pad, pad.uid, pad.pad); });
        setStatus(t("wired"));
        return;
      }
      wire = { uid: pad.uid, pad: pad.pad };
      setStatus(pad.ref + " " + t("foot") + " " + pad.label + ". " + t("pick2"));
      renderSide();
      draw();
      return;
    }
    wire = null;
    if (part) {
      selected = part.uid;
      drag = { kind: "move", uid: part.uid, pid: e.pointerId, bx: part.x, by: part.y, cx: e.clientX, cy: e.clientY, moved: false };
      canvas.setPointerCapture(e.pointerId);
      renderSide();
      draw();
      return;
    }
    selected = null;
    drag = { kind: "pan", pid: e.pointerId, cx: e.clientX, cy: e.clientY, px: view.panX, py: view.panY };
    canvas.setPointerCapture(e.pointerId);
    renderSide();
    draw();
  });
  canvas.addEventListener("pointermove", function (e) {
    var pt = clientToBoard(e.clientX, e.clientY);
    document.getElementById("coord").textContent = pt ? (pt.x.toFixed(1) + " , " + pt.y.toFixed(1) + " mm") : "";
    if (!drag || drag.pid !== e.pointerId) return;
    if (drag.kind === "orbit") {
      cam.yaw = drag.yaw + (e.clientX - drag.cx) * 0.008;
      cam.pitch = Math.max(0.35, Math.min(1.35, drag.pitch - (e.clientY - drag.cy) * 0.005));
      draw();
      return;
    }
    if (drag.kind === "move") {
      var origin = clientToBoard(drag.cx, drag.cy);
      var now = clientToBoard(e.clientX, e.clientY);
      if (!origin || !now) return;
      var part = PCB.findPart(doc, drag.uid);
      part.x = PCB.snap(drag.bx + now.x - origin.x);
      part.y = PCB.snap(drag.by + now.y - origin.y);
      drag.moved = true;
      draw();
    } else if (drag.kind === "pan") {
      view.panX = drag.px + (e.clientX - drag.cx);
      view.panY = drag.py + (e.clientY - drag.cy);
      fit();
      draw();
    }
  });
  canvas.addEventListener("pointerup", function (e) {
    if (!drag || drag.pid !== e.pointerId) return;
    if (drag.kind === "move" && drag.moved) {
      var part = PCB.findPart(doc, drag.uid);
      var x = part.x, y = part.y;
      part.x = drag.bx;
      part.y = drag.by;
      if (dockPart(part, 0, 0)) {
        var bb = PCB.bodyBox({ type: part.type, x: x, y: y, rot: part.rot });
        var dk = dockPart(part, bb.x + bb.w / 2, bb.y + bb.h / 2);
        if (part.type !== "uno" && (!dk || !fits(part.type, dk.x, dk.y, part.uid, dk.rot))) {
          setStatus(t("noFit"));
          draw();
        } else {
          mutate(function () {
            PCB.movePart(doc, part.uid, dk.x, dk.y);
            PCB.findPart(doc, part.uid).rot = dk.rot;
          });
        }
      } else if (!fits(part.type, x, y, part.uid)) {
        setStatus(t("noFit"));
        draw();
      } else {
        mutate(function () { PCB.movePart(doc, part.uid, x, y); });
      }
    }
    drag = null;
  });
  canvas.addEventListener("wheel", function (e) {
    e.preventDefault();
    if (mode === "3d" && cam) {
      cam.dist = Math.max(42, Math.min(160, cam.dist + (e.deltaY > 0 ? 6 : -6)));
      draw();
      return;
    }
    var next = view.zoom * (e.deltaY > 0 ? 0.9 : 1.1);
    view.zoom = Math.max(0.6, Math.min(4, next));
    fit();
    draw();
  }, { passive: false });

  document.addEventListener("keydown", function (e) {
    var tag = document.activeElement && document.activeElement.tagName;
    if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
    if (e.key === "Escape") { wire = null; setStatus(t("cancelled")); draw(); }
    if ((e.key === "r" || e.key === "R") && selected) {
      e.preventDefault();
      mutate(function () { rotateSel(selected); });
    }
    if ((e.key === "Backspace" || e.key === "Delete") && selected) {
      e.preventDefault();
      var uid = selected;
      selected = null;
      wire = null;
      mutate(function () { PCB.removePart(doc, uid); });
    }
    if ((e.metaKey || e.ctrlKey) && e.key === "z") {
      e.preventDefault();
      document.getElementById("undo").click();
    }
  });

  document.getElementById("undo").addEventListener("click", function () {
    if (!undo.length) return;
    doc = undo.pop();
    selected = null;
    wire = null;
    this.disabled = !undo.length;
    syncHead();
    renderSide();
    draw();
    save();
  });
  document.getElementById("download").addEventListener("click", function () {
    var btn = this;
    btn.disabled = true;
    btn.textContent = t("preparing");
    try {
      PCB.route(doc);
      var zip = PCB.exportZip(doc);
      var blob = new Blob([zip], { type: "application/zip" });
      var a = document.createElement("a");
      var safe = (doc.name || "board").replace(/[^\u4e00-\u9fffA-Za-z0-9_-]+/g, "");
      a.href = URL.createObjectURL(blob);
      a.download = (safe || "board") + "-jlc.zip";
      a.click();
      URL.revokeObjectURL(a.href);
      toast(t("downloaded"));
      showTab("fab");
    } catch (err) {
      setStatus(t("dlFail"));
    }
    btn.disabled = false;
    btn.textContent = t("download");
    renderSide();
    draw();
  });
  document.getElementById("name").addEventListener("change", function () {
    snapshot();
    doc.name = this.value.trim() || "我的電路板";
    save();
  });
  function readBoard() {
    var w = Number(document.getElementById("bw").value);
    var h = Number(document.getElementById("bh").value);
    mutate(function () { PCB.setBoard(doc, w, h); });
    syncHead();
    fit();
    draw();
  }
  document.getElementById("bw").addEventListener("change", readBoard);
  document.getElementById("bh").addEventListener("change", readBoard);
  document.getElementById("tpl-led").addEventListener("click", function () {
    snapshot();
    var next = PCB.template("led");
    PCB.route(next);
    loadDoc(next);
    toast(t("loaded"));
  });
  document.getElementById("tpl-header").addEventListener("click", function () {
    snapshot();
    var next = PCB.template("header");
    PCB.route(next);
    loadDoc(next);
  });
  document.getElementById("tpl-ubit").addEventListener("click", function () {
    snapshot();
    var next = PCB.template("ubit");
    PCB.route(next);
    loadDoc(next);
    toast(t("loaded"));
  });
  document.getElementById("tpl-uno").addEventListener("click", function () {
    snapshot();
    var next = PCB.template("uno");
    PCB.route(next);
    loadDoc(next);
    toast(t("loaded"));
  });
  document.getElementById("tpl-blank").addEventListener("click", function () {
    snapshot();
    loadDoc(PCB.blank("我的電路板"));
  });
  document.getElementById("holes").addEventListener("click", function () {
    mutate(function () {
      [[5.08, 5.08], [doc.w - 5.08, 5.08], [5.08, doc.h - 5.08], [doc.w - 5.08, doc.h - 5.08]].forEach(function (p) {
        if (fits("hole", PCB.snap(p[0]), PCB.snap(p[1]))) PCB.addPart(doc, "hole", p[0], p[1]);
      });
    });
  });
  function setMode(next) {
    mode = next;
    document.getElementById("view-flat").setAttribute("aria-pressed", next === "flat" ? "true" : "false");
    document.getElementById("view-3d").setAttribute("aria-pressed", next === "3d" ? "true" : "false");
    wire = null;
    if (next === "3d") {
      boot3D();
      if (three3d) {
        resize3D();
        three3d.controls.enabled = true;
      } else {
        cam = PCBView3D.frame(doc, canvas.width, canvas.height);
      }
    } else if (three3d) {
      three3d.controls.enabled = false;
    }
    draw();
  }
  document.getElementById("view-flat").addEventListener("click", function () { setMode("flat"); });
  document.getElementById("view-3d").addEventListener("click", function () { setMode("3d"); });
  document.getElementById("view-front").addEventListener("click", function () {
    setMode("3d");
    if (three3d) { fitCam3D(); return; }
    cam = PCBView3D.frame(doc, canvas.width, canvas.height, PCBView3D.frontYaw, PCBView3D.frontPitch);
    draw();
  });
  document.getElementById("lang").addEventListener("click", function () {
    lang = lang === "en" ? "zh" : "en";
    applyLang();
    draw();
  });
  document.getElementById("zoom-in").addEventListener("click", function () {
    if (mode === "3d" && three3d) { dolly3D(0.85); return; }
    if (mode === "3d" && cam) { cam.dist = Math.max(42, cam.dist - 8); draw(); return; }
    view.zoom = Math.min(4, view.zoom * 1.2); fit(); draw();
  });
  document.getElementById("zoom-out").addEventListener("click", function () {
    if (mode === "3d" && three3d) { dolly3D(1.18); return; }
    if (mode === "3d" && cam) { cam.dist = Math.min(160, cam.dist + 8); draw(); return; }
    view.zoom = Math.max(0.6, view.zoom / 1.2); fit(); draw();
  });
  document.getElementById("zoom-fit").addEventListener("click", function () {
    if (mode === "3d" && three3d) { fitCam3D(); return; }
    if (mode === "3d") { cam = PCBView3D.frame(doc, canvas.width, canvas.height); draw(); return; }
    view.zoom = 1; view.panX = 0; view.panY = 0; fit(); draw();
  });
  document.querySelectorAll("[data-layer]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      layer = btn.getAttribute("data-layer");
      document.querySelectorAll("[data-layer]").forEach(function (b) {
        b.setAttribute("aria-pressed", b === btn ? "true" : "false");
      });
      draw();
    });
  });
  document.getElementById("tab-net").addEventListener("click", function () { showTab("net"); });
  document.getElementById("tab-drc").addEventListener("click", function () { showTab("drc"); });
  document.getElementById("tab-fab").addEventListener("click", function () { showTab("fab"); });

  var tplParam = location.search.match(/tpl=(led|header|ubit|uno|blank)/);
  var brokenTest = location.search.indexOf("draft=broken") >= 0;
  try {
    var raw = localStorage.getItem(KEY);
    doc = raw ? JSON.parse(raw) : PCB.template("led");
  } catch (e) {
    doc = PCB.template("led");
  }
  doc = PCB.sanitize(doc);
  if (!doc) doc = PCB.template("led");
  if (brokenTest) {
    doc = PCB.sanitize({
      version: 0,
      name: "爛草稿",
      w: 999,
      h: "abc",
      mask: "black",
      parts: [
        { uid: "p1", type: "ghost-part-xyz", x: 10, y: 10, rot: 137, ref: "X1" },
        { uid: "p2", type: "led", x: 20, y: 20, rot: 45, ref: "D9", value: "紫" },
        { uid: "p3", type: "res", x: 40, y: 20, rot: 0, ref: "R9", value: "1K" },
        { uid: "p4", type: "led", x: 60, y: 20, rot: 0, ref: "D8", value: "紅" }
      ],
      nets: [
        { id: "n1", name: "x", pins: [{ uid: "p1", pad: "A" }, { uid: "p2", pad: "A" }, { uid: "p9", pad: "ZZ" }] },
        { id: "n2", name: "燈的正極", pins: [{ uid: "p2", pad: "K" }, { uid: "p3", pad: "1" }] },
        { id: "n3", name: "接地", pins: [{ uid: "p3", pad: "2" }, { uid: "p4", pad: "K" }] }
      ]
    });
  }
  if (tplParam) {
    doc = PCB.template(tplParam[1]);
    PCB.route(doc);
  }
  if (doc.nets.length && !(doc.routes && doc.routes.length)) PCB.route(doc);
  syncHead();
  applyLang();
  window.addEventListener("resize", resize);
  requestAnimationFrame(function () { setTimeout(resize, 0); });
  resize();
  if (location.search.indexOf("test=1") >= 0) {
    document.title = "TINKER " + (three3d ? "three" : "fallback");
  }
})();
</script>
</body>
</html>
